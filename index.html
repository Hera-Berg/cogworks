  const el=document.getElementById('detail'); if(el)el.style.display='none'; }

// The panel rebuilds its DOM only when structure changes (which machine,
// which recipe, which items exist). Per-frame updates touch text/width only,
// so buttons stay clickable and hover states survive.
function detailSignature(b){
  let s=b.type+'@'+b.x+','+b.y;
  if(b.type==='furnace') s+='|'+(b.input.item||'-')+'|'+(b.out.item||'-')+'|'+unlocked.has('steel-plate');
  if(b.type==='assembler') s+='|'+(b.recipe||'-')+'|'+(b.out.item||'-')+'|'+research.index;
  if(b.type==='chest') s+='|'+Object.keys(b.store).filter(k=>b.store[k]>0).sort().join(',');
  if(b.type==='lab') s+='|'+research.index;
  if(b.type==='silo') s+='|'+b.launched;
  return s;
}
function swp(item){ return item? `<span class="sw" style="background:${ITEMS[item].c}"></span>`
  : '<span class="sw" style="background:#20262f"></span>'; }
function vrow(label,item,vkey){ return `<div class="drow">${swp(item)}<span class="lb">${label}</span><span class="vl" data-v="${vkey}"></span></div>`; }
function prow(pkey,col){ return `<div class="pbar"><i data-p="${pkey}" style="background:linear-gradient(90deg,${col}55,${col})"></i></div>`; }
function mbtn(act,label,item){ const sw=item?`<span class="sw" style="background:${ITEMS[item].c}"></span>`:'';
  return `<button class="mini" data-act="${act}"${item?` data-item="${item}"`:''}>${sw}${label}</button>`; }

// Returns why a machine is or isn't working: {t:label, w:severity 0 ok /1 idle /2 critical}
function machineStatus(b){
  if(b.type==='assembler'){
    if(!b.recipe) return {t:'Pick a recipe',w:1};
    const rec=RECIPES[b.recipe], outName=Object.keys(rec.out)[0];
    if(b.out.count>=OUT_CAP && b.out.item===outName) return {t:'Output full',w:1};
    if(!Object.keys(rec.in).every(k=>(b.inputs[k]||0)>=rec.in[k])) return {t:'Needs ingredients',w:1};
    if(powerEff<=0) return {t:'⚡ No power',w:2};
    if(powerEff<1) return {t:'⚡ Low power',w:2};
    return {t:'Working',w:0};
  }
  if(b.type==='furnace'){
    if(!b.rec && b.input.count===0) return {t:'Needs ore/plates',w:1};
    if(!b.electric && b.coal<=0 && b.fuelT<=0) return {t:'Out of fuel',w:2};
    if(b.electric && powerEff<=0) return {t:'⚡ No power',w:2};
    if(b.out.count>=OUT_CAP) return {t:'Output full',w:1};
    return {t:'Smelting',w:0};
  }
  if(b.type==='lab'){
    if(research.index>=TECHS.length) return {t:'Research done',w:0};
    const tech=TECHS[research.index]; let has=false;
    for(const ty in tech.cost) if(b.packs[ty]>0) has=true;
    if(!has) return {t:'Needs science packs',w:1};
    if(powerEff<=0) return {t:'⚡ No power',w:2};
    if(powerEff<1) return {t:'⚡ Low power',w:2};
    return {t:'Researching',w:0};
  }
  if(b.type==='miner'){
    const t=terrainAt(b.x,b.y);
    if(!t||!t.ore||t.amount<=0) return {t:'Patch depleted',w:1};
    if(b.buffer>=MINER_BUF) return {t:'Buffer full',w:1};
    if(b.electric && powerEff<=0) return {t:'⚡ No power',w:2};
    return {t:'Mining',w:0};
  }
  if(b.type==='generator'){
    if(b.solar) return {t:'Solar — always on',w:0};
    if(b.on) return {t:'Running',w:0};
    if(b.coal>0||b.fuelT>0) return {t:'Standby (no demand)',w:0};
    return {t:'Out of fuel',w:2};
  }
  if(b.type==='silo'){
    if(b.launched) return {t:'Launched',w:0};
    if(b.parts>=ROCKET_REQ) return {t:'Ready to launch',w:0};
    return {t:'Awaiting parts',w:1};
  }
  return {t:'',w:0};
}

function buildDetailHTML(b){
  const title = b.item&&ITEMS[b.item]? ITEMS[b.item].name :
    ({furnace:'Furnace',assembler:'Assembler',chest:'Wooden Chest',lab:'Lab',
      miner:'Mining Drill',generator:'Steam Generator',silo:'Rocket Silo'})[b.type];
  let body='';
  if(['assembler','furnace','lab','miner','generator','silo'].includes(b.type))
    body+=`<div class="mstat" data-v="mstat"></div>`;
  if(b.type==='furnace'){
    const steel=unlocked.has('steel-plate'), elec=b.electric;
    body+=vrow('Smelting',null,'frec');
    body+=vrow('Input',b.input.item,'fin');
    if(!elec) body+=vrow('Fuel (coal)','coal','ffuel');
    else body+=vrow('Power',null,'fpow');
    body+=vrow('Output',b.out.item,'fout');
    body+=prow('fp', elec?'#5ec2b0':'#ffb02e');
    body+=`<div class="btnrow">`+(elec?'':mbtn('fuel','+10','coal'));
    if(b.input.item) body+=mbtn('ore','+10',b.input.item);
    else { body+=mbtn('ore','+10','iron-ore')+mbtn('ore','+10','copper-ore')+mbtn('ore','+10','stone');
      if(steel) body+=mbtn('ore','+10','iron-plate'); }
    body+=mbtn('takeout','Take output')+`</div>`;
    body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">${elec?'Runs on power, no coal — 3× speed. ':'Feed by hand, or automate with inserters / a drill. '}${steel?'Smelt 5 iron plates → 1 steel.':''}</div>`;
  } else if(b.type==='assembler'){
    const avail=ASM_RECIPES.filter(id=>unlocked.has(id));
    body+=`<div class="sect-title" style="margin-top:0">Recipe</div><div class="rchoose">`+
      avail.map(id=>{ const on=b.recipe===id; const outName=Object.keys(RECIPES[id].out)[0];
        return `<div class="rc ${on?'on':''}" data-r="${id}"><span class="sw" style="background:${ITEMS[outName].c}"></span>${ITEMS[outName].name}</div>`;
      }).join('')+`</div>`;
    if(b.recipe){ const rec=RECIPES[b.recipe];
      body+=`<div class="sect-title">Inputs</div>`;
      for(const k in rec.in) body+=vrow(ITEMS[k].name,k,'ain-'+k);
      body+=vrow('Output',Object.keys(rec.out)[0],'aout');
      body+=prow('ap','#4a90cf');
      body+=`<div class="btnrow">`+mbtn('load','Load ingredients')+mbtn('takeout','Take output')+`</div>`;
    } else body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Pick a recipe, then feed it by hand or with inserters. Assemblers need power.</div>`;
  } else if(b.type==='chest'){
    const ks=Object.keys(b.store).filter(k=>b.store[k]>0).sort();
    body+= ks.length? ks.map(k=>vrow(ITEMS[k].name,k,'cs-'+k)).join('')
      : `<div style="font-size:11px;color:var(--faint)">Empty. Deposit below, or load it with inserters.</div>`;
    body+=`<div class="sect-title" style="margin-top:10px">Deposit ×10</div>`;
    body+=`<div class="btnrow">`+DEP_ITEMS.filter(k=>unlocked.has(k)||invCount(k)>0||['coal','iron-ore','copper-ore','stone'].includes(k)).map(k=>mbtn('dep','+10',k)).join('')+`</div>`;
    body+=`<div class="btnrow">`+mbtn('wall','Withdraw all')+`</div>`;
  } else if(b.type==='lab'){
    const greenUnlocked=unlocked.has('logistics-science-pack');
    const blueUnlocked=unlocked.has('production-science-pack');
    body+=vrow('Red packs','automation-science-pack','lpr');
    if(greenUnlocked) body+=vrow('Green packs','logistics-science-pack','lpg');
    if(blueUnlocked) body+=vrow('Blue packs','production-science-pack','lpb');
    body+=vrow('Researching',null,'lt');
    body+=`<div class="btnrow">`+mbtn('packr','+5','automation-science-pack');
    if(greenUnlocked) body+=mbtn('packg','+5','logistics-science-pack');
    if(blueUnlocked) body+=mbtn('packb','+5','production-science-pack');
    body+=`</div>`;
    body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Labs consume packs over time to advance research. Labs need power.</div>`;
  } else if(b.type==='miner'){
    body+=vrow('Facing',null,'mf');
    body+=vrow('Mining',b.oreItem,'mb');
    body+=vrow('Patch left',null,'mp');
    if(b.electric) body+=vrow('Power',null,'mpow');
    body+=`<div class="btnrow">`+mbtn('takebuf','Take buffer')+`</div>`;
    if(b.electric) body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Electric drills mine 2.5× faster but need power.</div>`;
  } else if(b.type==='generator'){
    if(b.solar){
      body+=vrow('Output',null,'gout');
      body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Solar panels supply power for free — no fuel needed.</div>`;
    } else {
      body+=vrow('Status',null,'gst');
      body+=vrow('Fuel (coal)','coal','gfuel');
      body+=vrow('Output',null,'gout');
      body+=`<div class="btnrow">`+mbtn('gfuel','+10','coal')+`</div>`;
      body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Burns coal to power electric machines. Only runs when power is demanded.</div>`;
    }
  } else if(b.type==='silo'){
    if(b.launched){
      body+=`<div style="font-size:12px;color:var(--green);margin:6px 0">✓ Rocket launched.</div>`;
      body+=`<div style="font-size:10px;color:var(--faint)">The factory must grow.</div>`;
    } else {
      body+=vrow('Rocket parts','rocket-part','sp');
      body+=prow('spp','#e0b040');
      body+=`<div class="btnrow">`+mbtn('part','+5','rocket-part')+mbtn('launch','🚀 LAUNCH')+`</div>`;
      body+=`<div style="font-size:10px;color:var(--faint);margin-top:8px">Deliver ${ROCKET_REQ} rocket parts, then launch to win.</div>`;
    }
  }
  return `<div class="ph"><b>${title}</b><span class="x" id="dX">✕</span></div><div class="pb">${body}</div>`;
}

function refreshDetail(){
  const el=document.getElementById('detail'); if(!el||!selected) return;
  const b=selected, sig=detailSignature(b);
  if(sig!==detailSig){
    detailSig=sig; el.innerHTML=buildDetailHTML(b);
    el.querySelector('#dX').onclick=closeDetail;
    el.querySelectorAll('.rc').forEach(rc=>rc.onclick=()=>setAssemblerRecipe(b,rc.dataset.r));
    el.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>detailAction(b,btn.dataset.act,btn.dataset.item));
  }
  updateDetailValues(el,b);
}
function setv(el,k,txt){ const n=el.querySelector(`[data-v="${k}"]`); if(n&&n.textContent!==txt)n.textContent=txt; }
function setp(el,k,frac){ const n=el.querySelector(`[data-p="${k}"]`); if(n)n.style.width=Math.min(100,(frac||0)*100)+'%'; }
function setoff(el,act,item,off){
  el.querySelectorAll(`[data-act="${act}"]`).forEach(btn=>{
    if(item===undefined || btn.dataset.item===item) btn.classList.toggle('off',off);
  });
}
function updateDetailValues(el,b){
  const statEl=el.querySelector('[data-v="mstat"]');
  if(statEl){ const st=machineStatus(b);
    statEl.textContent=st.t;
    statEl.style.color = st.w===2? 'var(--red)' : st.w===1? 'var(--amber)' : 'var(--green)';
  }
  if(b.type==='furnace'){
    setv(el,'frec', b.rec? ITEMS[Object.keys(RECIPES[b.rec].out)[0]].name : 'idle');
    setv(el,'fin', b.input.count+' / '+FURN_IN);
    if(b.electric) setv(el,'fpow', powerEff>=0.999?'full':(powerEff>0?Math.round(powerEff*100)+'%':'no power'));
    else setv(el,'ffuel', b.coal+' / '+FURN_FUEL);
    setv(el,'fout', b.out.count+' / '+OUT_CAP);
    setp(el,'fp', b.prog);
    if(!b.electric) setoff(el,'fuel',undefined, invCount('coal')===0 || b.coal>=FURN_FUEL);
    ['iron-ore','copper-ore','stone','iron-plate'].forEach(o=>
      setoff(el,'ore',o, invCount(o)===0 || b.input.count>=FURN_IN || (b.input.item&&b.input.item!==o)));
    setoff(el,'takeout',undefined, b.out.count===0);
  } else if(b.type==='assembler'){
    if(b.recipe){ const rec=RECIPES[b.recipe];
      for(const k in rec.in) setv(el,'ain-'+k,(b.inputs[k]||0)+' / '+(rec.in[k]*ASM_STACKS));
      setv(el,'aout', b.out.count+' / '+OUT_CAP);
      setp(el,'ap', b.prog);
      const canLoad=Object.keys(rec.in).some(k=>invCount(k)>0 && (b.inputs[k]||0)<rec.in[k]*ASM_STACKS);
      setoff(el,'load',undefined,!canLoad);
      setoff(el,'takeout',undefined, b.out.count===0);
    }
  } else if(b.type==='chest'){
    for(const k in b.store) setv(el,'cs-'+k, String(b.store[k]));
    DEP_ITEMS.forEach(k=>setoff(el,'dep',k, invCount(k)===0));
    setoff(el,'wall',undefined, Object.keys(b.store).every(k=>!b.store[k]));
  } else if(b.type==='lab'){
    setv(el,'lpr', b.packs.r+' / '+LAB_CAP);
    setv(el,'lpg', b.packs.g+' / '+LAB_CAP);
    setv(el,'lpb', b.packs.b+' / '+LAB_CAP);
    setv(el,'lt', research.index>=TECHS.length? 'complete':TECHS[research.index].name);
    setoff(el,'packr',undefined, invCount('automation-science-pack')===0 || b.packs.r>=LAB_CAP);
    setoff(el,'packg',undefined, invCount('logistics-science-pack')===0 || b.packs.g>=LAB_CAP);
    setoff(el,'packb',undefined, invCount('production-science-pack')===0 || b.packs.b>=LAB_CAP);
  } else if(b.type==='miner'){
    setv(el,'mf', DIRNAME[b.dir]);
    setv(el,'mb', b.buffer+' / '+MINER_BUF+' buffered');
    const t=terrainAt(b.x,b.y); setv(el,'mp', String(t?t.amount:0));
    if(b.electric) setv(el,'mpow', powerEff>=0.999?'full':(powerEff>0?Math.round(powerEff*100)+'%':'no power'));
    setoff(el,'takebuf',undefined, b.buffer===0);
  } else if(b.type==='generator'){
    if(b.solar){ setv(el,'gout', SOLAR_POWER+' kW'); }
    else {
      setv(el,'gst', b.on?'running':(b.coal>0||b.fuelT>0?'standby':'no fuel'));
      setv(el,'gfuel', b.coal+' / '+FURN_FUEL);
      setv(el,'gout', Math.round(GEN_POWER*genOutputMult)+' kW');
      setoff(el,'gfuel',undefined, invCount('coal')===0 || b.coal>=FURN_FUEL);
    }
  } else if(b.type==='silo'){
    if(!b.launched){
      setv(el,'sp', b.parts+' / '+ROCKET_REQ);
      setp(el,'spp', b.parts/ROCKET_REQ);
      setoff(el,'part',undefined, invCount('rocket-part')===0 || b.parts>=ROCKET_REQ);
      setoff(el,'launch',undefined, b.parts<ROCKET_REQ);
    }
  }
}
function detailAction(b,act,item){
  if(act==='fuel'){ const n=Math.min(10,invCount('coal'),FURN_FUEL-b.coal);
    if(n>0){ takeInv('coal',n); b.coal+=n; } }
  else if(act==='ore'){ if(b.input.item && b.input.item!==item) return;
    const n=Math.min(10,invCount(item),FURN_IN-b.input.count);
    if(n>0){ takeInv(item,n); b.input.item=item; b.input.count+=n; } }
  else if(act==='takeout'){ if(b.out && b.out.count>0){ addInv(b.out.item,b.out.count); b.out.item=null; b.out.count=0; } }
  else if(act==='load' && b.recipe){ const rec=RECIPES[b.recipe];
    for(const k in rec.in){ const n=Math.min(invCount(k), rec.in[k]*ASM_STACKS-(b.inputs[k]||0));
      if(n>0){ takeInv(k,n); b.inputs[k]=(b.inputs[k]||0)+n; } } }
  else if(act==='packr'){ const n=Math.min(5,invCount('automation-science-pack'),LAB_CAP-b.packs.r);
    if(n>0){ takeInv('automation-science-pack',n); b.packs.r+=n; } }
  else if(act==='packg'){ const n=Math.min(5,invCount('logistics-science-pack'),LAB_CAP-b.packs.g);
    if(n>0){ takeInv('logistics-science-pack',n); b.packs.g+=n; } }
  else if(act==='packb'){ const n=Math.min(5,invCount('production-science-pack'),LAB_CAP-b.packs.b);
    if(n>0){ takeInv('production-science-pack',n); b.packs.b+=n; } }
  else if(act==='gfuel'){ const n=Math.min(10,invCount('coal'),FURN_FUEL-b.coal);
    if(n>0){ takeInv('coal',n); b.coal+=n; } }
  else if(act==='part'){ const n=Math.min(5,invCount('rocket-part'),ROCKET_REQ-b.parts);
    if(n>0){ takeInv('rocket-part',n); b.parts+=n; } }
  else if(act==='launch'){ if(b.parts>=ROCKET_REQ && !b.launched){ b.launched=true; victory=true; showVictory(); } }
  else if(act==='dep'){ const n=Math.min(10,invCount(item));
    if(n>0){ takeInv(item,n); b.store[item]=(b.store[item]||0)+n; } }
  else if(act==='wall'){ for(const k in b.store){ if(b.store[k]>0) addInv(k,b.store[k]); } b.store={}; }
  else if(act==='takebuf'){ if(b.buffer>0 && b.oreItem){ addInv(b.oreItem,b.buffer); b.buffer=0; } }
  refreshHotbar(); refreshResStrip();
}
function setAssemblerRecipe(a,id){
  // return current inputs to inventory to avoid stuck items
  for(const k in a.inputs){ addInv(k,a.inputs[k]); }
  a.inputs={}; a.recipe=id; a.prog=0;
  refreshHotbar(); refreshResStrip();
}

// ----------------------------- Minimap -----------------------------
const miniCv=document.getElementById('miniCv');
const miniCtx=miniCv.getContext('2d');
const miniBase=document.createElement('canvas');
miniBase.width=WORLD_W; miniBase.height=WORLD_H;
let miniFrame=0;
const MINI_B={belt:'#7a6428',miner:'#d08a2f',furnace:'#d0703a',assembler:'#4a90cf',
  inserter:'#b04848',chest:'#b98a4a',lab:'#9569cf',generator:'#c9a23a',silo:'#e0e6f0',
  splitter:'#e0b84a'};
function rebuildMiniBase(){
  const g=miniBase.getContext('2d');
  for(let y=0;y<WORLD_H;y++) for(let x=0;x<WORLD_W;x++){
    const t=terrain[y][x];
    g.fillStyle = t.water? '#0e1c30' : (t.ore&&t.amount>0)? shade(ITEMS[t.ore].c,-60) : '#12211a';
    g.fillRect(x,y,1,1);
  }
  for(let y=0;y<WORLD_H;y++) for(let x=0;x<WORLD_W;x++){
    const b=grid[y][x];
    if(b){ g.fillStyle=MINI_B[b.type]||'#fff';
      // 2px blobs so single machines still read at the scaled-down size
      g.fillRect(Math.max(0,x-0.5),Math.max(0,y-0.5),2,2); }
  }
}
function drawMini(){
  miniCtx.clearRect(0,0,WORLD_W,WORLD_H);
  miniCtx.drawImage(miniBase,0,0);
  const z=cam.zoom;
  const vx=(cam.x-W/(2*z))/TILE, vy=(cam.y-H/(2*z))/TILE;
  const vw=W/(z*TILE), vh=H/(z*TILE);
  // clamp the indicator to the map so it never spills past the minimap edges
  const rx=Math.max(0,vx), ry=Math.max(0,vy);
  const rx2=Math.min(WORLD_W,vx+vw), ry2=Math.min(WORLD_H,vy+vh);
  miniCtx.strokeStyle='rgba(255,215,122,.95)'; miniCtx.lineWidth=1.5;
  miniCtx.strokeRect(rx+0.75, ry+0.75, Math.max(1,rx2-rx-1.5), Math.max(1,ry2-ry-1.5));
}
let miniDrag=false;
function miniJump(e){
  const r=miniCv.getBoundingClientRect();
  const cX=(e.touches&&e.touches[0])? e.touches[0].clientX : e.clientX;
  const cY=(e.touches&&e.touches[0])? e.touches[0].clientY : e.clientY;
  cam.x=Math.max(0,Math.min(WORLD_W,(cX-r.left)/r.width*WORLD_W))*TILE;
  cam.y=Math.max(0,Math.min(WORLD_H,(cY-r.top)/r.height*WORLD_H))*TILE;
}
miniCv.addEventListener('mousedown',e=>{ miniDrag=true; miniJump(e); e.preventDefault(); });
window.addEventListener('mousemove',e=>{ if(miniDrag) miniJump(e); });
window.addEventListener('mouseup',()=>{ miniDrag=false; });
miniCv.addEventListener('touchstart',e=>{ miniJump(e); e.preventDefault(); },{passive:false});
miniCv.addEventListener('touchmove',e=>{ miniJump(e); e.preventDefault(); },{passive:false});

const ORE_KEYS=[null,'iron-ore','copper-ore','coal','stone'];
const ORE_IDX={'iron-ore':1,'copper-ore':2,'coal':3,'stone':4};

function serializeB(b){
  const o={type:b.type,x:b.x,y:b.y,dir:b.dir,item:b.item};
  if(b.type==='belt') o.items=b.items.map(i=>[i.item,Math.round(i.pos*1000)/1000]);
  else if(b.type==='splitter'){ o.buf=b.buffer; o.tog=b.toggle; }
  else if(b.type==='miner'){ o.buf=b.buffer; o.ore=b.oreItem; }
  else if(b.type==='furnace'){ o.ii=b.input.item; o.ic=b.input.count; o.coal=b.coal;
    o.ft=b.fuelT; o.oi=b.out.item; o.oc=b.out.count; o.rec=b.rec; o.p=b.prog; }
  else if(b.type==='assembler'){ o.recipe=b.recipe; o.inputs=Object.assign({},b.inputs);
    o.oi=b.out.item; o.oc=b.out.count; o.p=b.prog; }
  else if(b.type==='inserter'){ o.hold=b.holding; o.t=b.t; }
  else if(b.type==='chest') o.store=Object.assign({},b.store);
  else if(b.type==='lab'){ o.packs=Object.assign({},b.packs); o.timer=b.timer; }
  else if(b.type==='generator'){ o.coal=b.coal; o.ft=b.fuelT; }
  else if(b.type==='silo'){ o.parts=b.parts; o.launched=b.launched; }
  return o;
}
function hydrateB(b,r){
  switch(b.type){
    case 'belt': b.items=(r.items||[]).map(a=>({item:a[0],pos:+a[1]||0})); break;
    case 'splitter': b.buffer=r.buf||null; b.toggle=r.tog|0; break;
    case 'miner': b.buffer=r.buf|0; if(r.ore)b.oreItem=r.ore; break;
    case 'furnace': b.input.item=r.ii||null; b.input.count=r.ic|0; b.coal=r.coal|0;
      b.fuelT=+r.ft||0; b.out.item=r.oi||null; b.out.count=r.oc|0; b.rec=r.rec||null; b.prog=+r.p||0; break;
    case 'assembler': b.recipe=r.recipe||null; b.inputs=Object.assign({},r.inputs||{});
      b.out.item=r.oi||null; b.out.count=r.oc|0; b.prog=+r.p||0; break;
    case 'inserter': b.holding=r.hold||null; b.t=+r.t||0; break;
    case 'chest': b.store=Object.assign({},r.store||{}); break;
    case 'lab': b.packs=(r.packs&&typeof r.packs==='object')? {r:r.packs.r|0,g:r.packs.g|0,b:r.packs.b|0} : {r:0,g:0,b:0};
      b.timer=+r.timer||0; break;
    case 'generator': b.coal=r.coal|0; b.fuelT=+r.ft||0; break;
    case 'silo': b.parts=r.parts|0; b.launched=!!r.launched; break;
  }
}
function buildSaveObject(){
  const amt=new Array(WORLD_W*WORLD_H), ore=new Array(WORLD_W*WORLD_H);
  for(let y=0;y<WORLD_H;y++) for(let x=0;x<WORLD_W;x++){
    const t=terrain[y][x], i=y*WORLD_W+x;
    amt[i]=t.amount; ore[i]=t.ore? ORE_IDX[t.ore]:0;
  }
  const bs=[].concat(belts,miners,furnaces,assemblers,inserters,chests,labs,generators,silos,splitters).map(serializeB);
  return {v:3, w:WORLD_W, h:WORLD_H, seed:worldSeed, amt, ore, b:bs,
    inv:Object.assign({},inventory),
    research:{index:research.index, prog:{r:research.prog.r,g:research.prog.g,b:research.prog.b}},
    mults:[miningMult,logisticsMult,craftingMult,genOutputMult,smeltMult],
    prod:Object.assign({},prodCount), total:totalProd, mi:mIndex,
    victory, cam:{x:cam.x,y:cam.y,z:cam.zoom}};
}
function applySave(s){
  if(!s || typeof s.seed!=='number' || !Array.isArray(s.b)) throw new Error('bad save');
  if((s.v!==2 && s.v!==3) || s.w!==WORLD_W || s.h!==WORLD_H) throw new Error('old');
  resetWorld(s.seed,false);
  if(Array.isArray(s.amt)&&Array.isArray(s.ore)){
    for(let y=0;y<WORLD_H;y++) for(let x=0;x<WORLD_W;x++){
      const i=y*WORLD_W+x, t=terrain[y][x];
      t.ore=ORE_KEYS[s.ore[i]]||null; t.amount=s.amt[i]|0;
    }
  }
  for(const r of s.b){
    if(!inWorld(r.x,r.y) || grid[r.y][r.x] || !listFor(r.type)) continue;
    const b=makeBuilding(r.type,r.x,r.y,r.dir|0,r.item);
    hydrateB(b,r);
    grid[r.y][r.x]=b; listFor(r.type).push(b);
  }
  inventory=Object.assign({},s.inv||{});
  const rp=(s.research&&s.research.prog)||{};
  research={index:(s.research&&s.research.index)|0, prog:{r:rp.r|0, g:rp.g|0, b:rp.b|0}};
  if(Array.isArray(s.mults)){ miningMult=+s.mults[0]||1; logisticsMult=+s.mults[1]||1;
    craftingMult=+s.mults[2]||1; genOutputMult=+s.mults[3]||1; smeltMult=+s.mults[4]||1; }
  prodCount=Object.assign({},s.prod||{}); totalProd=s.total|0; mIndex=s.mi|0; mAcc=0;
  victory=!!s.victory;
  recomputeUnlocked();
  if(s.cam){ cam.x=+s.cam.x||cam.x; cam.y=+s.cam.y||cam.y; cam.zoom=+s.cam.z||1; }
  prerenderGround(); // ore layout may differ from a pure regen after mining edits
  lastStrip=''; lastResearch=''; lastObjective='';
  buildHotbar(); refreshResStrip(); rebuildMiniBase();
}
function resetWorld(seed,fresh){
  belts=[]; miners=[]; furnaces=[]; assemblers=[]; inserters=[]; chests=[]; labs=[];
  generators=[]; silos=[]; splitters=[];
  parts.length=0; closeAllPanels();
  genWorld(seed);
  if(fresh){
    startingInventory();
    research={index:0,prog:{r:0,g:0,b:0}};
    miningMult=logisticsMult=craftingMult=genOutputMult=smeltMult=1; victory=false;
    prodCount={}; totalProd=0; mIndex=0; mAcc=0;
    unlocked=baseUnlocked();
    cam.x=(WORLD_W>>1)*TILE; cam.y=(WORLD_H>>1)*TILE; cam.zoom=1;
  }
  const w=document.getElementById('win'); if(w)w.remove();
  lastStrip=''; lastResearch=''; lastObjective='';
  buildHotbar(); refreshResStrip(); rebuildMiniBase();
}
function saveGame(){
  try{
    const blob=new Blob([JSON.stringify(buildSaveObject())],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='cogworks-save-'+(worldSeed>>>0)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    notify('Save downloaded','ok');
  }catch(err){ notify('Save failed','bad'); }
}
document.getElementById('loadFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{ applySave(JSON.parse(rd.result)); notify('Game loaded','ok'); closeWorld(); }
    catch(err){ notify(err&&err.message==='old'? 'Save is from an older version — start a new world':'Could not read that save file','bad'); }
  };
  rd.readAsText(f); ev.target.value='';
});

// ----------------------------- World menu -----------------------------
let worldOpen=false;
function armBtn(btn,fn){
  let armed=false;
  btn.onclick=()=>{
    if(!armed){ armed=true; btn.dataset.old=btn.textContent;
      btn.textContent='Click again to confirm';
      setTimeout(()=>{ armed=false; if(btn.dataset.old)btn.textContent=btn.dataset.old; },2500);
    } else { armed=false; fn(); }
  };
}
function toggleWorld(){
  if(worldOpen){ closeWorld(); return; }
  closeAllPanels(); worldOpen=true;
  let el=document.getElementById('world');
  if(!el){ el=document.createElement('div'); el.className='panel'; el.id='world'; document.body.appendChild(el); }
  el.innerHTML=`<div class="ph"><b>World</b><span class="x" id="wX">✕</span></div>
    <div class="pb">
      <div class="wrow"><label>Seed</label><input class="winput" id="seedIn" value="${worldSeed}"></div>
      <button class="wbtn" id="wSave">💾 Save game to file</button>
      <button class="wbtn" id="wLoad">📂 Load game from file</button>
      <button class="wbtn warn" id="wNew">✦ New random world</button>
      <button class="wbtn warn" id="wSeed">Generate world from seed</button>
      <div style="font-size:10px;color:var(--faint);margin-top:10px;line-height:1.6">
        Saves download as a .json file — keep it anywhere and load it back any time.
        New worlds discard unsaved progress; the same seed always builds the same map.</div>
    </div>`;
  el.style.display='block';
  el.querySelector('#wX').onclick=closeWorld;
  el.querySelector('#wSave').onclick=saveGame;
  el.querySelector('#wLoad').onclick=()=>document.getElementById('loadFile').click();
  armBtn(el.querySelector('#wNew'),()=>{
    resetWorld((Math.random()*0x7fffffff)|0,true);
    notify('New world · seed '+worldSeed,'ok'); closeWorld();
  });
  armBtn(el.querySelector('#wSeed'),()=>{
    const v=el.querySelector('#seedIn').value;
    resetWorld(seedFrom(v),true);
    notify('World generated · seed '+worldSeed,'ok'); closeWorld();
  });
}
function closeWorld(){ worldOpen=false;
  const el=document.getElementById('world'); if(el)el.style.display='none'; }

// ----------------------------- Boot -----------------------------
function startingInventory(){
  inventory={
    'burner-mining-drill':6,'stone-furnace':6,'transport-belt':70,'inserter':18,
    'assembling-machine':3,'wooden-chest':6,'lab':1,'steam-engine':2,
    'coal':150,'iron-plate':70,'copper-plate':45,'iron-gear-wheel':24,'stone':60,'copper-cable':20,
  };
}

function init(){
  resize();
  resetWorld((Math.random()*0x7fffffff)|0,true);
  buildHotbar();
  refreshResStrip();
  updateReadout();
  toggleHelp();       // show intro
  let last=performance.now(), acc=0;
  function frame(now){
    const rdt=(now-last)/1000; last=now;
    handlePan(rdt);
    if(!paused){ acc+=Math.min(rdt,0.1); while(acc>=DT){ tick(); acc-=DT; } }
    render(now/1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
init();
</script>
